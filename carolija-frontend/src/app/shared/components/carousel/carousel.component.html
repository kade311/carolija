<div class="carousel-container" *ngIf="items.length > 0">
    <div class="carousel-track">
        <a class="product-card" *ngFor="let item of infiniteItems" [routerLink]="['/products', item.productId]">
            <img [src]="item.productImages?.[0]?.imageUrl" alt="{{item.productName}}">
            <p>{{item.productName}}</p>
            <strong>{{item.productPrice}}</strong>
        </a>
    </div>
</div>
