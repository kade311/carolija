<nav class="navbar">
    <div class="navbar-container">
        <a routerLink="/" class="navbar-logo">
            Carolija
        </a>

        <div class="menu-toggle" (click)="toggleMenu()">
            <span [class.open]="isMenuOpen"></span>
            <span [class.open]="isMenuOpen"></span>
            <span [class.open]="isMenuOpen"></span>
        </div>

        <ul class="nav-links" [class.active]="isMenuOpen">
            <li><a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" (click)="isMenuOpen = false">Početna</a></li>
            
            <li *ngIf="authService.isAdmin()">
                <a routerLink="/admin/dashboard" class="admin-link" (click)="isMenuOpen = false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px; vertical-align: middle;"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    Admin Panel
                </a>
            </li>
            
            <li *ngIf="!authService.isLoggedIn()">
                <a routerLink="/login" class="btn-login" (click)="isMenuOpen = false">Prijava</a>
            </li>

            <ng-container *ngIf="authService.isLoggedIn()">
                <li class="user-info">
                    <span>{{ authService.getUserEmail() }}</span>
                </li>
                <li>
                    <button (click)="openLogoutModal()" class="btn-logout">Odjavi se</button>
                </li>
            </ng-container>
        </ul>
    </div>
</nav>


<div class="modal-overlay" *ngIf="showLogoutModal" (click)="cancelLogout()">
    <div class="logout-modal" (click)="$event.stopPropagation()">
        <div class="modal-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ff4081" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </div>
        <h3>Odjava</h3>
        <p>Jeste li sigurni da se želite odjaviti sa sistema?</p>
        
        <div class="modal-actions">
            <button class="btn-cancel" (click)="cancelLogout()">Odustani</button>
            <button class="btn-confirm" (click)="logout()">Odjavi se</button>
        </div>
    </div>
</div>
