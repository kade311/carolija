<div class="admin-container">
    <div class="header">
        <h2>Upravljanje kategorijama</h2>
        <button class="add-btn" [routerLink]="['/admin/categories/manage']">Dodaj novu kategoriju</button>
    </div>

    <div class="category-list">
        <div *ngFor="let cat of categories" class="category-item" [ngClass]="{'deleted-style': cat.isDeleted}">
            <div class="cat-info" [routerLink]="['/admin/products', cat.categoryID]" style="cursor: pointer;">
                <img [src]="cat.imageUrl" alt="">
                <span [style.text-decoration]="cat.isDeleted ? 'line-through' : 'none'">{{cat.categoryName}}</span>
            </div>

            <div class="cat-actions">
                <button class="edit-btn" *ngIf="!cat.isDeleted" (click)="$event.stopPropagation(); editCategory(cat.categoryID)">
                    Uredi
                </button>

                <button class="delete-btn" *ngIf="!cat.isDeleted" 
                    (click)="$event.stopPropagation(); openModal(cat, 'delete')">
                    Obrisi
                </button>

                <button class="restore-btn" *ngIf="cat.isDeleted" 
                    (click)="$event.stopPropagation(); openModal(cat, 'restore')">
                    Vrati
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" *ngIf="showModal">
        <div class="modal-card">
            <h3>{{ modalType === 'delete' ? 'Potvrda brisanja' : 'Potvrda vracanja' }}</h3>
            <p>
                Jeste li sigurni da zelite {{ modalType === 'delete' ? 'obrisati' : 'vratiti' }}
                kategoriju <strong>{{ selectedCategoryName }}</strong>?
            </p>

            <div class="modal-actions">
                <button class="btn-cancel" (click)="closeModal()">Odustani</button>
                <button [className]="modalType === 'delete' ? 'btn-confirm' : 'btn-restore-confirm'" 
                        (click)="categoryDeleteOrRestore()">
                    Potvrdi
                </button>
            </div>
        </div>
    </div>
</div>
