<div class="manage-container">
    <div class="header">
        <h2>{{ isEditMode ? 'Izmijeni proizvod' : 'Dodaj novi proizvod' }}</h2>
        <p *ngIf="!isEditMode">Kategorija ID: <strong>{{ categoryId }}</strong></p>
    </div>

    <div class="form-group">
        <label for="lightRequirement">Svjetlost</label>
        <select id="lightRequirement" name="lightRequirement" [(ngModel)]="productData.lightRequirement">
            <option value="Direct">Direktno svjetlo</option>
            <option value="Indirect">Indirektno svjetlo</option>
            <option value="Low">Slabo svjetlo</option>
        </select>
    </div>

    <div class="form-group">
        <label for="wateringRequirement">Zalijevanje</label>
        <select id="wateringRequirement" name="wateringRequirement" [(ngModel)]="productData.wateringRequirement">
            <option value="Low">Rijetko</option>
            <option value="Moderate">Umjereno</option>
            <option value="High">Često</option>
        </select>
    </div>

    <label class="pet-friendly">
        <input type="checkbox" name="isPetFriendly" [(ngModel)]="productData.isPetFriendly">
        Pet-friendly biljka
    </label>

    <form (ngSubmit)="onSubmit()" #productForm="ngForm" class="styled-form">
        <div class="form-group">
            <label for="name">Naziv proizvoda</label>
            <input 
                type="text" 
                id="name" 
                name="name" 
                [(ngModel)]="productData.name" 
                required 
                placeholder="Unesite naziv...">
        </div>

        <div class="form-group">
            <label for="price">Cijena (KM)</label>
            <input 
                type="number" 
                id="price" 
                name="price" 
                [(ngModel)]="productData.price" 
                required 
                placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="description">Opis proizvoda</label>
            <textarea 
                id="description" 
                name="description" 
                [(ngModel)]="productData.description" 
                rows="4" 
                placeholder="Kratak opis proizvoda..."></textarea>
        </div>

        <div class="actions">
            <button type="button" class="cancel-btn" [routerLink]="['/admin/products', categoryId]">Odustani</button>
            <button type="submit" class="save-btn" [disabled]="!productForm.valid || isSubmitting">
                {{ isEditMode ? 'Sacuvaj izmjene' : 'Kreiraj proizvod' }}
            </button>
        </div>
    </form>
</div>
