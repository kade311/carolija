<div class="homepage-container">
    
    <section class="carousel-section">
        <h2 class="section-title">Novo u ponudi</h2>
        <app-carousel [items]="latestAddedProducts"></app-carousel>
    </section>

    <section class="categories-section">
        <h2 class="section-title">Kategorije</h2>
        <div class="category-grid">
            <div
                *ngFor="let cat of categories"
                class="category-card"
                [routerLink]="['/shop']"
                [queryParams]="{ categoryId: cat.categoryID }">
                <div class="category-image-wrapper">
                    <img [src]="cat.imageUrl" [alt]="cat.categoryName">
                </div>
                <div class="category-info">
                    <h3>{{cat.categoryName}}</h3>
                    <p *ngIf="cat.categoryDescription">{{cat.categoryDescription}}</p>
                </div>
            </div>
        </div>
    </section>

</div>
