<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Kreiraj nalog</h2>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
      <div class="form-group">
        <label for="email">Email adresa</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          [class.error]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
        >
        <small class="error-msg" *ngIf="registerForm.get('email')?.errors?.['email'] && registerForm.get('email')?.touched">
          Unesite ispravan email format.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Lozinka</label>
        <div class="password-wrapper">
            <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            formControlName="password" 
            [class.error]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
            >
            <button type="button" class="toggle-btn" (click)="togglePassword()" aria-label="Toggle password visibility">
                <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
        </div>
        <div class="password-hints" *ngIf="registerForm.get('password')?.touched">
          <small [class.valid]="!registerForm.get('password')?.errors?.['minlength']">Min. 8 karaktera</small>
          <small [class.valid]="!registerForm.get('password')?.errors?.['pattern']">Veliko i malo slovo, broj</small>
        </div>
      </div>

      <app-turnstile
        *ngIf="turnstileSiteKey"
        [siteKey]="turnstileSiteKey"
        action="register"
        (tokenChange)="onTurnstileTokenChange($event)">
      </app-turnstile>

      <div class="alert-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-register" [disabled]="registerForm.invalid || isSubmitting || !turnstileToken">
        Registruj se
      </button>

      <div class="auth-footer">
        <span>Vec imate nalog?</span>
        <a routerLink="/login">Prijavi se</a>
      </div>
    </form>
  </div>
</div>
